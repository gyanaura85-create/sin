
name: Build NearKart Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Check Expo Configuration
        run: npx expo config --type public

      - name: Generate Android Project
        run: npx expo prebuild --platform android --non-interactive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload NearKart APK
        uses: actions/upload-artifact@v4
        with:
          name: NearKart-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload NearKart Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: NearKart-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
